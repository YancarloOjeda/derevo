
name: Pruebas automatizadas DEREVO

on:
  workflow_dispatch:
  push:
    paths:
      - "tests/**"
      - "includes/**"
      - ".github/workflows/pruebas-php.yml"

permissions:
  contents: read

jobs:
  pruebas:
    name: PHPUnit - PCB-012
    runs-on: ubuntu-latest

    steps:
      - name: Obtener archivos del repositorio
        uses: actions/checkout@v4

      - name: Configurar PHP y PHPUnit
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"
          extensions: mbstring, dom, xml
          coverage: none
          tools: phpunit:^11
        env:
          fail-fast: true

      - name: Verificar entorno
        run: |
          php -v
          phpunit --version

      
      - name: Ejecutar PCB-012
        run: |
          mkdir -p resultados

          # PCB-009 (desactivada)
          # phpunit tests/ReportsFiltersTest.php \
          #   --testdox \
          #   --log-junit resultados/PCB-009.xml

          # PCB-010 (desactivada)
          # phpunit tests/ReportsDatesTest.php \
          #   --testdox \
          #   --log-junit resultados/PCB-010.xml

          # PCB-011 (desactivada)
          # phpunit tests/MovementsTypeTest.php \
          #   --testdox \
          #   --log-junit resultados/PCB-011.xml

          # PCB-012 (activa)
          phpunit tests/MovementsStatusTest.php \
            --testdox \
            --log-junit resultados/PCB-012.xml

      - name: Guardar evidencia PCB-012
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Evidencia-PCB-012
          path: resultados/PCB-012.xml
          if-no-files-found: warn
